name: Classify Properties

on:
  push:
    paths:
      - "input_properties.csv"
  workflow_dispatch:

jobs:
  classify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai requests beautifulsoup4

      - name: Run property classifier
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python classifier.py --input input_properties.csv --output classified_results.csv

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: classified-results
          path: classified_results.csv
          retention-days: 30

      - name: Print results to log
        run: cat classified_results.csv
