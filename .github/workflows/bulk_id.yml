name: Bulk ID Test Run

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "Input CSV path, relative to bulk_id/"
        required: true
        default: "sample_input.csv"
      limit:
        description: "Only process the first N properties (e.g. 3 for a test; leave blank for a full run)"
        required: false
        default: ""
      concurrency:
        description: "Number of properties to process in parallel"
        required: true
        default: "15"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r bulk_id/requirements.txt

      - name: Run bulk ID prompt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONCURRENCY: ${{ inputs.concurrency }}
        working-directory: bulk_id
        run: |
          if ! [[ "$CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
            echo "Concurrency must be a whole number of 1 or more (got '$CONCURRENCY')"
            exit 1
          fi
          cp .env.example .env
          input_name="$(basename "${{ inputs.input_file }}")"
          echo "OUTPUT_FILE=${input_name%.*}_results.csv" >> "$GITHUB_ENV"
          echo "SNOWFLAKE_FILE=${input_name%.*}_results_snowflake.csv" >> "$GITHUB_ENV"
          args=(--input "${{ inputs.input_file }}" --output "${input_name%.*}_results.csv")
          if [ -n "${{ inputs.limit }}" ]; then
            args+=(--limit "${{ inputs.limit }}")
          fi
          python run_bulk_id.py "${args[@]}"

      - name: Show first rows of both output files (test runs only)
        if: always() && inputs.limit != ''
        working-directory: bulk_id
        run: |
          for f in "$OUTPUT_FILE" "$SNOWFLAKE_FILE"; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            python -c "import csv,sys; [print(dict(r)) for r in csv.DictReader(open(sys.argv[1], encoding='utf-8'))]" "$f"
          done

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-id-results
          path: |
            bulk_id/${{ env.OUTPUT_FILE }}
            bulk_id/${{ env.SNOWFLAKE_FILE }}
          retention-days: 30
          if-no-files-found: warn
